<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#121212">
    <link rel="icon" href="/icons/icon-192.jpg" type="image/jpeg">
    <link rel="apple-touch-icon" href="/icons/icon-192.jpg">
    <title>Avooria's Dark Chat 🌑</title>
    <style>
        /* --- استایل‌های تم دارک --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            /* پس‌زمینه خیلی تیره */
            color: #e0e0e0;
            /* متن روشن */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background: #1e1e1e;
            /* پس‌زمینه کارت */
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 100%;
            max-width: 980px;
        }

        h2 {
            margin-top: 0;
            color: #ffffff;
        }

        #status {
            margin: 15px 0;
            font-size: 14px;
            color: #aaa;
        }

        .users-box {
            margin-top: 20px;
            text-align: left;
            border-top: 1px solid #333;
            padding-top: 10px;
        }

        .user-count {
            font-weight: bold;
            font-size: 14px;
            color: #ccc;
            margin-bottom: 10px;
        }

        .users-box ul {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 150px;
            overflow-y: auto;
        }

        .users-box li {
            padding: 8px;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            font-size: 14px;
            color: #ddd;
        }

        .dot {
            height: 8px;
            width: 8px;
            background-color: #2ecc71;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }

        /* --- دکمه‌ها --- */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }

        button {
            flex: 1;
            padding: 12px;
            font-size: 14px;
            cursor: pointer;
            color: white;
            border: none;
            border-radius: 6px;
            transition: background 0.3s, transform 0.1s;
            min-width: 100px;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background-color: #444 !important;
            color: #888;
            cursor: not-allowed;
        }

        #mic-btn {
            background-color: #007bff;
        }

        #mic-btn:hover {
            background-color: #0056b3;
        }

        #cam-btn {
            background-color: #6c757d;
        }

        #cam-btn:hover {
            background-color: #545b62;
        }

        /* دکمه قرمز برای اتمام جلسه */
        #end-btn {
            background-color: #dc3545;
            flex-basis: 100%;
            /* کل ردیف را بگیرد یا جدا باشد */
        }

        #end-btn:hover {
            background-color: #a71d2a;
        }

        /* --- استایل جدید شبکه ویدیو و دکمه فول اسکرین --- */
        .content-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
            align-items: start;
        }

        #video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 0;
            width: 100%;
        }

        /* کانتینر دور هر ویدیو برای قرار دادن دکمه روی آن */
        .video-wrapper {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            aspect-ratio: 4/3;
            /* نسبت تصویر ثابت */
        }

        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* دکمه فول اسکرین شناور */
        .fs-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            width: 30px;
            height: 30px;
            padding: 0;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            /* مخفی در حالت عادی */
            transition: opacity 0.2s;
            flex: none;
            /* جلوگیری از تغییر سایز توسط فلکس والد */
        }

        /* نمایش دکمه وقتی موس روی ویدیو میرود */
        .video-wrapper:hover .fs-btn {
            opacity: 1;
        }

        .fs-btn:hover {
            background: rgba(0, 0, 0, 0.9);
        }

        /* Mirror local (front) camera */
        .mirror {
            transform: scaleX(-1);
        }

        .chat-box {
            border: 1px solid #333;
            border-radius: 10px;
            background: #181818;
            display: flex;
            flex-direction: column;
            min-height: 320px;
            padding: 10px;
            gap: 10px;
        }

        .is-hidden {
            display: none !important;
        }

        .chat-title {
            text-align: left;
            font-size: 14px;
            color: #bbb;
            font-weight: 600;
        }

        #chat-messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .chat-message {
            max-width: 85%;
            padding: 8px 10px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.4;
            word-break: break-word;
        }

        .chat-message.me {
            align-self: flex-end;
            background: #0d6efd;
            color: #fff;
        }

        .chat-message.other {
            align-self: flex-start;
            background: #2b2b2b;
            color: #e5e5e5;
        }

        .chat-message.system {
            align-self: center;
            background: #343a40;
            color: #cfd3d8;
            font-size: 12px;
        }

        .chat-meta {
            display: block;
            font-size: 11px;
            opacity: 0.8;
            margin-bottom: 3px;
        }

        .chat-input-row {
            display: flex;
            gap: 8px;
        }

        #chat-input {
            flex: 1;
            border: 1px solid #3a3a3a;
            background: #111;
            color: #eee;
            border-radius: 8px;
            padding: 10px;
            font-size: 16px;
            outline: none;
        }

        #chat-send-btn {
            flex: none;
            min-width: 84px;
            background: #198754;
        }

        #chat-send-btn:hover {
            background: #146c43;
        }

        @media (max-width: 900px) {
            .content-layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Avooria's Chat ♥️</h2>
        <div id="status">Ready to join</div>

        <div class="content-layout">
            <div id="video-grid"></div>

            <div class="chat-box is-hidden">
                <div class="chat-title">Room Chat</div>
                <ul id="chat-messages"></ul>
                <div class="chat-input-row">
                    <input id="chat-input" type="text" placeholder="Type a message..." maxlength="500" />
                    <button id="chat-send-btn" disabled>Send</button>
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="mic-btn">Join & Speak</button>
            <button id="cam-btn" disabled>Camera Off</button>
            <button id="flip-btn" disabled>Flip Camera</button>
            <button id="end-btn" disabled>End Session</button>
        </div>

        <div class="users-box">
            <div class="user-count">Online: <span id="count">0</span></div>
            <ul id="participants-list"></ul>
        </div>
    </div>
    <script type="module" src="main.js"></script>
</body>

</html>
