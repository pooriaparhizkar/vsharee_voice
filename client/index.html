<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avooria's Chat ♥️</title>
    <style>
        /* --- استایل‌های قبلی --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        h2 {
            margin-top: 0;
            color: #333;
        }

        #status {
            margin: 15px 0;
            font-size: 14px;
            color: #666;
        }

        .users-box {
            margin-top: 20px;
            text-align: left;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }

        .user-count {
            font-weight: bold;
            font-size: 14px;
            color: #444;
            margin-bottom: 10px;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 150px;
            overflow-y: auto;
        }

        li {
            padding: 8px;
            border-bottom: 1px solid #f9f9f9;
            display: flex;
            align-items: center;
            font-size: 14px;
        }

        .dot {
            height: 8px;
            width: 8px;
            background-color: #2ecc71;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }

        /* --- استایل‌های جدید برای دکمه‌ها --- */
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        button {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            cursor: pointer;
            color: white;
            border: none;
            border-radius: 6px;
            transition: background 0.3s;
        }

        button:disabled {
            background-color: #ccc !important;
            cursor: not-allowed;
        }

        #mic-btn {
            background-color: #007bff;
        }

        /* آبی پیشفرض */
        #cam-btn {
            background-color: #6c757d;
        }

        /* خاکستری پیشفرض (خاموش) */

        /* --- استایل جدید برای شبکه ویدیو --- */
        #video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
            width: 100%;
        }

        /* استایل تگ‌های video که لایوکیت می‌سازد */
        video {
            width: 100%;
            height: auto;
            border-radius: 8px;
            background: #000;
            object-fit: cover;
            /* پر کردن کادر */
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Avooria's Chat ♥️</h2>
        <div id="status">Ready to join</div>

        <div id="video-grid"></div>

        <div class="controls">
            <button id="mic-btn">Join & Speak</button>
            <button id="cam-btn" disabled>Camera Off</button>
        </div>

        <div class="users-box">
            <div class="user-count">Online: <span id="count">0</span></div>
            <ul id="participants-list"></ul>
        </div>
    </div>
    <script type="module" src="main.js"></script>
</body>

</html>
