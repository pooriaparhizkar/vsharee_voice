version: '3.8'
services:
  livekit:
    image: livekit/livekit-server:latest
    command: ['--dev', '--bind', '0.0.0.0']
    ports:
      - "7880:7880"
      - "7881:7881"

  voice-backend:
    build: ./server
    ports:
      - "4000:4000"
    env_file:
      - ./server/.env

  voice-frontend:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ./client:/app
    command: sh -c "npx serve -l 3000"
    ports:
      - "3000:3000"